<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paramètres</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
background:#f5f5f5;
font-family:Arial;
}

/* HEADER */
.header{
display:flex;
align-items:center;
padding:15px;
background:#fff;
border-bottom:1px solid #ddd;
font-size:18px;
font-weight:bold;
}

.back{
font-size:20px;
margin-right:10px;
cursor:pointer;
}

/* SECTION */
.section{
margin:15px;
}

/* CARD */
.card{
background:#fff;
border-radius:12px;
padding:15px;
margin-bottom:15px;
}

/* ITEM */
.item{
margin-bottom:15px;
}

.label{
color:#888;
font-size:13px;
}

.value{
font-size:16px;
font-weight:bold;
margin-top:3px;
}

/* BUTTON */
.logout{
background:#28a745;
color:#fff;
text-align:center;
padding:15px;
border-radius:12px;
font-weight:bold;
margin-top:20px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="back" onclick="goBack()">←</div>
Paramètres
</div>

<div class="section">

<!-- USER INFO -->
<div class="card">

<div class="item">
<div class="label">Nom complet</div>
<div class="value" id="name">...</div>
</div>

<div class="item">
<div class="label">Téléphone</div>
<div class="value" id="phone">...</div>
</div>

<div class="item">
<div class="label">Date d'inscription</div>
<div class="value" id="date">...</div>
</div>

</div>

<!-- LOGOUT -->
<div class="logout" onclick="logout()">
Se déconnecter
</div>

</div>

<script>

const client = supabase.createClient(
"https://ycswpdydsgoqplkqtpsd.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inljc3dwZHlkc2dvcXBsa3F0cHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NjY4MTcsImV4cCI6MjA5MDU0MjgxN30.67bBMdHtcGFIJuZuY_Xd4hBN4hj86JjHVXGN3oPbKMA"
);

/* LOAD USER */
async function loadUser(){

let userId = localStorage.getItem("user_id");
if(!userId) return;

const { data } = await client
.from("users")
.select("full_name, phone, country_code, created_at")
.eq("id", userId)
.single();

if(data){

document.getElementById("name").innerText = data.full_name;

document.getElementById("phone").innerText =
data.country_code + " " + data.phone;

/* FORMAT DATE */
let date = new Date(data.created_at);
document.getElementById("date").innerText =
date.toLocaleDateString("fr-FR");

}

}

/* LOGOUT */
function logout(){

localStorage.removeItem("user_id");

/* tu peux aussi nettoyer plus si besoin */
localStorage.clear();

window.location.href = "login.html";

}

/* BACK */
function goBack(){
window.location.href = "account.html";
}

loadUser();

</script>

</body>
</html>
