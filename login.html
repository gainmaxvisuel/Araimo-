<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARAIMO | Connexion</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Arial;}
body{margin:0;background:#f5f5f5;}

.header{
display:flex;align-items:center;padding:15px;
background:#fff;border-bottom:1px solid #ddd;
}

.header span{font-size:20px;cursor:pointer;}
.header h2{flex:1;text-align:center;margin:0;color:#00a86b;}

.container{padding:20px;max-width:400px;margin:auto;}

.title{text-align:center;margin-top:20px;}

.logo{text-align:center;margin:30px 0;}
.logo img{width:80px;}

.phone-box{
display:flex;align-items:center;border:1px solid #ccc;
border-radius:12px;margin-top:20px;background:#fff;
overflow:hidden;position:relative;
}

.country-select{padding:14px;font-weight:bold;cursor:pointer;}
.divider{width:1px;height:30px;background:#ccc;}

.phone-box input{
flex:1;border:none;padding:14px;outline:none;
}

.dropdown{
position:absolute;top:55px;left:0;background:#fff;
border:1px solid #ccc;border-radius:10px;
display:none;max-height:200px;overflow:auto;z-index:10;width:120px;
}

.dropdown div{padding:10px;cursor:pointer;}
.dropdown div:hover{background:#eee;}

.pass-box{position:relative;margin-top:12px;}

.input{
width:100%;padding:16px;border-radius:12px;border:1px solid #ccc;
}

.eye{
position:absolute;right:15px;top:50%;
transform:translateY(-50%);
cursor:pointer;opacity:0.6;font-size:18px;
}

button{
width:100%;padding:16px;margin-top:20px;
border:none;border-radius:30px;
background:linear-gradient(90deg,#00c853,#009624);
color:#fff;font-size:16px;font-weight:bold;
}

.link{text-align:center;margin-top:15px;}
.link a{color:#00a86b;text-decoration:none;}

.error{color:red;text-align:center;margin-top:10px;}
</style>

</head>

<body>

<div class="header">
<span onclick="history.back()">←</span>
<h2>Connexion</h2>
</div>

<div class="container">

<div class="title">
<h1>Salut !<br>Connexion Immédiate</h1>
</div>

<div class="logo">
<img src="logo.png">
<h1>ARAIMO</h1>
</div>

<!-- PHONE -->
<div class="phone-box">
<div class="country-select" onclick="toggleDropdown()">
<span id="selectedCountry">+226</span>
</div>
<div class="divider"></div>
<input type="text" id="phone" placeholder="Numéro Téléphone">
</div>

<!-- DROPDOWN -->
<div class="dropdown" id="dropdown">
<div onclick="setCountry('+226')">🇧🇫 +226</div>
<div onclick="setCountry('+225')">🇨🇮 +225</div>
<div onclick="setCountry('+221')">🇸🇳 +221</div>
<div onclick="setCountry('+223')">🇲🇱 +223</div>
<div onclick="setCountry('+228')">🇹🇬 +228</div>
<div onclick="setCountry('+229')">🇧🇯 +229</div>
</div>

<!-- PASSWORD -->
<div class="pass-box">
<input class="input" type="password" id="pass" placeholder="Mot de passe">
<span class="eye" onclick="togglePass()">👁️</span>
</div>

<div class="error" id="msg"></div>

<button onclick="login()">Connexion</button>

<div class="link">
Vous n'avez pas de compte ? 
<a href="index.html">S'inscrire</a>
</div>

</div>

<script>

const { createClient } = supabase;

const client = createClient(
"https://ycswpdydsgoqplkqtpsd.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inljc3dwZHlkc2dvcXBsa3F0cHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NjY4MTcsImV4cCI6MjA5MDU0MjgxN30.67bBMdHtcGFIJuZuY_Xd4hBN4hj86JjHVXGN3oPbKMA"
);

/* FIX LOCALSTORAGE POUR APP INVENTOR */
if (typeof localStorage === "undefined" || localStorage === null) {
  window.localStorage = {
    data: {},
    setItem: function(k, v){ this.data[k] = v; },
    getItem: function(k){ return this.data[k]; }
  };
}

/* PAYS */
let currentCountry = "+226";

function toggleDropdown(){
let d = document.getElementById("dropdown");
d.style.display = d.style.display === "block" ? "none" : "block";
}

function setCountry(code){
currentCountry = code;
document.getElementById("selectedCountry").innerText = code;
document.getElementById("dropdown").style.display = "none";
}

/* PASSWORD */
function togglePass(){
let p = document.getElementById("pass");
p.type = p.type === "password" ? "text" : "password";
}

/* CLEAN PHONE */
function cleanPhone(num){
return num.replace(/\s+/g, "");
}

/* LOGIN */
async function login(){

let phone = cleanPhone(document.getElementById("phone").value);
let pass = document.getElementById("pass").value.trim();
let msg = document.getElementById("msg");

msg.innerText = "";

if(!phone || !pass){
msg.innerText = "Veuillez remplir tous les champs.";
return;
}

try{

const { data, error } = await client
.from("users")
.select("id")
.eq("country_code", currentCountry)
.eq("phone", phone)
.eq("password", pass)
.single();

if(error || !data){
throw new Error("Numéro ou mot de passe incorrect.");
}

/* STOCKAGE SAFE */
localStorage.setItem("user_id", data.id);

/* 🔥 POUR APP INVENTOR */
if (window.AppInventor) {
  window.AppInventor.setWebViewString(data.id);
}

/* SUCCESS */
msg.style.color = "green";
msg.innerText = "Connexion réussie...";

setTimeout(()=>{
window.location.href = "dashboard.html";
},1200);

}catch(err){
msg.style.color = "red";
msg.innerText = err.message;
}

}

</script>

</body>
</html>
