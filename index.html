<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARAIMO | Inscription</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
background:#f5f5f5;
}

/* HEADER */
.header{
display:flex;
align-items:center;
padding:15px;
background:#fff;
border-bottom:1px solid #ddd;
}

.header span{
font-size:20px;
cursor:pointer;
}

.header h2{
flex:1;
text-align:center;
margin:0;
color:#00a86b;
}

/* CONTAINER */
.container{
padding:20px;
max-width:400px;
margin:auto;
}

/* TITLE */
.title{
text-align:center;
margin-top:20px;
}

.title h1{
font-size:28px;
margin:0;
}

/* LOGO */
.logo{
text-align:center;
margin:20px 0;
}

.logo img{
width:80px;
height:80px;
object-fit:contain;
margin-bottom:10px;
}

.logo h1{
font-size:32px;
margin:0;
font-weight:bold;
color:#222;
}

/* INPUT */
.input{
width:100%;
padding:16px;
margin-top:12px;
border-radius:12px;
border:1px solid #ccc;
font-size:15px;
outline:none;
}

/* PHONE BOX */
.phone-box{
display:flex;
align-items:center;
border:1px solid #ccc;
border-radius:12px;
margin-top:12px;
background:#fff;
overflow:hidden;
}

.country-select{
padding:14px;
display:flex;
gap:5px;
align-items:center;
cursor:pointer;
font-weight:bold;
}

.divider{
width:1px;
height:30px;
background:#ccc;
}

.phone-box input{
flex:1;
border:none;
padding:14px;
outline:none;
}

/* DROPDOWN */
.dropdown{
display:none;
background:#fff;
border:1px solid #ccc;
border-radius:10px;
margin-top:5px;
max-height:200px;
overflow:auto;
}

.dropdown div{
padding:12px;
cursor:pointer;
}

.dropdown div:hover{
background:#00c853;
color:#fff;
}

/* PASSWORD BOX */
.pass-box{
position:relative;
}

.eye{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:18px;
opacity:0.6;
}

/* BUTTON */
button{
width:100%;
padding:16px;
margin-top:20px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#00c853,#009624);
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

/* LINK */
.link{
text-align:center;
margin-top:15px;
}

.link a{
color:#00a86b;
text-decoration:none;
}

/* ERROR */
.error{
color:red;
text-align:center;
margin-top:10px;
}

/* TOAST (comme Clearway) */
.toast{
position:fixed;
left:50%;
top:55%;
transform:translate(-50%,-50%);
background:#555;
color:#fff;
padding:12px 25px;
border-radius:6px;
display:none;
font-size:14px;
}
</style>

</head>

<body>

<div class="header">
<span onclick="history.back()">←</span>
<h2>Inscription</h2>
</div>

<div class="container">

<div class="title">
<h1>Créer<br>Nouveau Compte</h1>
</div>

<div class="logo">
<img src="logo.png" alt="Araimo Logo">
<h1>ARAIMO</h1>
</div>

<!-- NOM -->
<input class="input" id="name" placeholder="Nom complet">

<!-- PHONE -->
<div class="phone-box">
<div class="country-select" onclick="toggleDropdown()">
<span id="selectedCountry">+226</span>
<span>▼</span>
</div>

<div class="divider"></div>

<input type="text" id="phone" placeholder="Numéro téléphone">
</div>

<!-- LISTE PAYS -->
<div class="dropdown" id="dropdownList">
<div onclick="selectCountry('+226')">🇧🇫 Burkina Faso (+226)</div>
<div onclick="selectCountry('+225')">🇨🇮 Côte d’Ivoire (+225)</div>
<div onclick="selectCountry('+223')">🇲🇱 Mali (+223)</div>
<div onclick="selectCountry('+229')">🇧🇯 Bénin (+229)</div>
<div onclick="selectCountry('+228')">🇹🇬 Togo (+228)</div>
<div onclick="selectCountry('+237')">🇨🇲 Cameroun (+237)</div>
</div>

<!-- PASSWORD -->
<div class="pass-box">
<input class="input" type="password" id="pass" placeholder="Veuillez entrer le mot de passe">
<span class="eye" onclick="togglePass('pass')">👁</span>
</div>

<!-- CONFIRM -->
<div class="pass-box">
<input class="input" type="password" id="confirm" placeholder="Veuillez entrer à nouveau le mot de passe">
<span class="eye" onclick="togglePass('confirm')">👁</span>
</div>

<!-- REF -->
<input class="input" id="referral" placeholder="Code parrain">

<div class="error" id="msg"></div>

<button id="btn" onclick="register()">Inscription</button>

<div class="link">
Vous avez déjà un compte ? 
<a href="login.html">Connexion</a>
</div>

</div>

<!-- TOAST -->
<div class="toast" id="toast">Inscription réussie</div>

<script>

const { createClient } = supabase;

const client = createClient(
"https://ycswpdydsgoqplkqtpsd.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inljc3dwZHlkc2dvcXBsa3F0cHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NjY4MTcsImV4cCI6MjA5MDU0MjgxN30.67bBMdHtcGFIJuZuY_Xd4hBN4hj86JjHVXGN3oPbKMA"
);

let country_code = "+226";

/* DROPDOWN */
function toggleDropdown(){
let list = document.getElementById("dropdownList");
list.style.display = list.style.display === "block" ? "none" : "block";
}

function selectCountry(code){
country_code = code;
document.getElementById("selectedCountry").innerText = code;
document.getElementById("dropdownList").style.display = "none";
}

/* TOGGLE PASSWORD */
function togglePass(id){
let input = document.getElementById(id);
input.type = input.type === "password" ? "text" : "password";
}

/* TOAST */
function showToast(){
let t = document.getElementById("toast");
t.style.display = "block";
setTimeout(()=>{ t.style.display="none"; },2000);
}

/* REGISTER */
async function register(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let pass = document.getElementById("pass").value;
let confirm = document.getElementById("confirm").value;
let referral = document.getElementById("referral").value;

let msg = document.getElementById("msg");
let btn = document.getElementById("btn");

msg.innerText = "";

if(!name || !phone || !pass){
msg.innerText = "Remplis tous les champs";
return;
}

if(pass !== confirm){
msg.innerText = "Mot de passe incorrect";
return;
}

btn.disabled = true;
btn.innerText = "Création...";

try{

const { error } = await client.rpc("register_user", {
p_full_name: name,
p_country_code: country_code,
p_phone: phone,
p_password: pass,
p_referral_code: referral || null
});

if(error) throw error;

showToast();

setTimeout(()=>{
window.location.href = "login.html";
},2000);

}catch(err){
msg.innerText = err.message;
btn.disabled = false;
btn.innerText = "Inscription";
}

}

/* AUTO REF */
window.onload = function(){
const params = new URLSearchParams(window.location.search);
const ref = params.get("ref");
if(ref){
document.getElementById("referral").value = ref;
}
}

</script>

</body>
</html>
