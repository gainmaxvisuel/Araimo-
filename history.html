<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

.header{
display:flex;
align-items:center;
padding:15px;
background:#fff;
border-bottom:1px solid #ddd;
}

.back{
font-size:22px;
cursor:pointer;
margin-right:10px;
}

.title{
font-size:18px;
font-weight:bold;
}

/* TABS */
.tabs{
display:flex;
background:#fff;
padding:10px;
gap:10px;
}

.tab{
flex:1;
text-align:center;
padding:10px;
border-radius:10px;
background:#eee;
cursor:pointer;
}

.tab.active{
background:#00c853;
color:#fff;
}

/* LIST */
.container{
padding:15px;
}

.card{
background:#fff;
border:2px solid #00c853;
border-radius:15px;
padding:15px;
margin-bottom:15px;
position:relative;
}

.status{
position:absolute;
top:10px;
right:15px;
font-weight:bold;
font-size:13px;
}

.row{
margin-top:8px;
color:#555;
font-size:14px;
}

.type{
font-weight:bold;
font-size:16px;
color:#000;
}

.amount{
font-weight:bold;
font-size:15px;
}

.received{
color:#00c853;
font-weight:bold;
}

.date{
font-size:12px;
color:#888;
}

.empty{
text-align:center;
color:#777;
margin-top:40px;
}

</style>
</head>

<body>

<div class="header">
<div class="back" onclick="location.href='account.html'">←</div>
<div class="title">Transactions</div>
</div>

<div class="tabs">
<div class="tab active" data-type="all">Tous</div>
<div class="tab" data-type="deposit">Dépôt</div>
<div class="tab" data-type="withdraw">Retrait</div>
<div class="tab" data-type="other">Autres</div>
</div>

<div class="container" id="list"></div>

<script>

const client = supabase.createClient(
"https://ycswpdydsgoqplkqtpsd.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inljc3dwZHlkc2dvcXBsa3F0cHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NjY4MTcsImV4cCI6MjA5MDU0MjgxN30.67bBMdHtcGFIJuZuY_Xd4hBN4hj86JjHVXGN3oPbKMA"
);

let userId = localStorage.getItem("user_id");

/* 🔥 TROUVER RETRAIT */
function findWithdrawal(tx, withdrawals){
return withdrawals.find(w => {

let sameAmount = w.amount == tx.amount;

let diff = Math.abs(
new Date(w.created_at) - new Date(tx.created_at)
);

return sameAmount && diff < 5000;

});
}

/* LOAD DATA */
async function loadData(filter="all"){

document.getElementById("list").innerHTML = "Chargement...";

if(!userId) return;

/* TRANSACTIONS */
const { data:tx } = await client
.from("transactions")
.select("*")
.eq("user_id", userId)
.order("created_at", { ascending:false });

/* WITHDRAWALS */
const { data:withdraws } = await client
.from("withdrawals")
.select("*")
.eq("user_id", userId);

let html = "";

(tx || []).forEach(t=>{

/* FILTRES */
if(filter === "deposit" && t.type !== "deposit") return;
if(filter === "withdraw" && t.type !== "withdraw") return;
if(filter === "other" && ["deposit","withdraw"].includes(t.type)) return;

/* TYPE PRO */
let typeText = "Autre";
if(t.type === "deposit") typeText = "Dépôt";
if(t.type === "withdraw") typeText = "Retrait";

/* STATUS */
let statusText = "En attente";
let statusColor = "#ff9800";

if(t.status === "success" || t.status === "completed"){
statusText = "Réussi";
statusColor = "#00c853";
}

if(t.status === "failed" || t.status === "rejected"){
statusText = "Échoué";
statusColor = "#ff4444";
}

/* RETRAIT */
let withdraw = null;
let receivedHTML = "";

if(t.type === "withdraw"){
withdraw = findWithdrawal(t, withdraws);
let fee = withdraw ? (withdraw.fee || 0) : 0;
let received = t.amount - fee;

receivedHTML = `
<div class="row received">
Reçu : FCFA ${formatMoney(received)}
</div>
`;
}

html += `
<div class="card">

<div class="status" style="color:${statusColor}">
${statusText}
</div>

<div class="row type">
${typeText}
</div>

<div class="row amount">
Montant : FCFA ${formatMoney(t.amount)}
</div>

${receivedHTML}

<div class="row">
${t.description || "Aucune description"}
</div>

<div class="row date">
${formatDate(t.created_at)}
</div>

</div>
`;

});

document.getElementById("list").innerHTML =
html || `<div class="empty">Aucune transaction</div>`;

}

/* FORMAT MONEY */
function formatMoney(x){
return (x || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

/* FORMAT DATE */
function formatDate(d){
return new Date(d).toLocaleString();
}

/* TABS */
document.querySelectorAll(".tab").forEach(tab=>{
tab.onclick = function(){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
this.classList.add("active");

loadData(this.dataset.type);

};
});

/* INIT */
loadData();

</script>

</body>
</html>
